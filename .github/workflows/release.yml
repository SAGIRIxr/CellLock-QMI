name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 要发布的已有标签（如 v1.0.0）
        required: true

permissions:
  contents: write

env:
  NDK_VERSION: 30.0.14904198

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Check version matches tag
        run: |
          version=$(sed -n "s/^ *versionName '\(.*\)'/\1/p" app/build.gradle)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::app/build.gradle versionName ($version) 与标签 $TAG 不一致"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0" "ndk;$NDK_VERSION" > /dev/null

      - name: Build native backends
        shell: pwsh
        run: ./build-native.ps1 -Ndk "$env:ANDROID_HOME/ndk/$env:NDK_VERSION"

      - name: Native self-tests (host)
        run: |
          for t in qmi efs; do
            gcc -std=c11 -O2 -Wall -Wextra -Werror -o "$RUNNER_TEMP/test_$t" "native/test_$t.c"
            "$RUNNER_TEMP/test_$t"
          done

      - name: Host logic tests
        shell: pwsh
        run: |
          $json = Join-Path $env:RUNNER_TEMP 'json-20240303.jar'
          Invoke-WebRequest https://repo.maven.apache.org/maven2/org/json/json/20240303/json-20240303.jar -OutFile $json
          ./tests/run-host.ps1 -AndroidJar "$env:ANDROID_HOME/platforms/android-35/android.jar" -JsonJar $json -Jdk $env:JAVA_HOME

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.CELLLOCK_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::缺少 CELLLOCK_KEYSTORE_BASE64 secret"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "CELLLOCK_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed release
        env:
          CELLLOCK_KEYSTORE_PASSWORD: ${{ secrets.CELLLOCK_KEYSTORE_PASSWORD }}
          CELLLOCK_KEY_ALIAS: ${{ secrets.CELLLOCK_KEY_ALIAS }}
          CELLLOCK_KEY_PASSWORD: ${{ secrets.CELLLOCK_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease lintRelease

      - name: Verify signature and collect assets
        run: |
          mkdir dist
          apk="dist/CellLock-$VERSION.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk"
          git archive --format=zip --prefix="CellLock-QMI-$VERSION/" -o "dist/CellLock-$VERSION-source.zip" "$TAG"
          (cd dist && sha256sum *.apk *.zip > SHA256SUMS.txt)
          awk -v v="$VERSION" '$0 ~ "^## "v"( |$)" {f=1; next} /^## / && f {exit} f' CHANGELOG.md > dist/notes.md
          cat dist/notes.md

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" dist/*.apk dist/*.zip dist/SHA256SUMS.txt \
            --title "CellLock $VERSION" --notes-file dist/notes.md --verify-tag
