name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  NDK_VERSION: 30.0.14904198

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0" "ndk;$NDK_VERSION" > /dev/null

      - name: Build native backends
        shell: pwsh
        run: ./build-native.ps1 -Ndk "$env:ANDROID_HOME/ndk/$env:NDK_VERSION"

      - name: Native self-tests (host)
        run: |
          for t in qmi efs; do
            gcc -std=c11 -O2 -Wall -Wextra -Werror -o "$RUNNER_TEMP/test_$t" "native/test_$t.c"
            "$RUNNER_TEMP/test_$t"
          done

      - name: Host logic tests
        shell: pwsh
        run: |
          $json = Join-Path $env:RUNNER_TEMP 'json-20240303.jar'
          Invoke-WebRequest https://repo.maven.apache.org/maven2/org/json/json/20240303/json-20240303.jar -OutFile $json
          ./tests/run-host.ps1 -AndroidJar "$env:ANDROID_HOME/platforms/android-35/android.jar" -JsonJar $json -Jdk $env:JAVA_HOME

      - name: Build and lint
        run: ./gradlew --no-daemon assembleDebug lintDebug

      - uses: actions/upload-artifact@v5
        with:
          name: CellLock-debug
          path: app/build/outputs/apk/debug/app-debug.apk
